# Reef, Bight, Winch and Hitch share one node (the same OPFS files and the lock 'bitcoin-blake:node' on one origin): two
# node versions on the same files is the failure this guards against. Daily (and after each Reef deploy, in test.yml) the published pages are
# fetched and their node pins compared; a difference fails the run (README, Releasing, step 3).
name: pins
on:
  schedule: [{ cron: '17 6 * * *' }]
  workflow_dispatch:
jobs:
  same-node:
    runs-on: ubuntu-latest
    steps:
      - name: compare the node pins of the published apps
        run: |
          set -e
          declare -A pin
          for f in reef/reef.js bight/bight.js winch/winch.js hitch/hitch.js; do
            p=$(curl -fsSL "https://bitcoin-blake.github.io/$f?nocache=$RANDOM" | grep -o 'blaketestnode@[0-9a-f]\{40\}' | sort -u)
            n=$(echo "$p" | grep -c . || true)
            echo "$f: $p"
            if [ "$n" != 1 ]; then echo "::error::$f pins $n node versions"; exit 1; fi
            pin[$f]=$p
          done
          if [ "$(printf '%s\n' "${pin[@]}" | sort -u | wc -l)" != 1 ]; then echo "::error::the apps pin different node versions"; exit 1; fi
          echo "all four pin ${pin[reef/reef.js]}"
