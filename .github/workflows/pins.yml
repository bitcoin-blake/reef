# Reef, Bight, Winch and Hitch share one node (the same OPFS files and the lock 'bitcoin-blake:node' on one origin): two
# node versions on the same files is the failure this guards against. On a schedule (and before and after each Reef deploy, in
# test.yml) the published pages are checked by tools/pins.mjs: the rules are in its header. GitHub runs a schedule on a
# best-effort basis: a run can be late or skipped, so the deploy-time checks are the ones a release relies on.
name: pins
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: the published apps' pins
        run: node tools/pins.mjs
