# Runs the wallet rules and the payment state machine against the real kernel, with the node, the sidestr library and the
# engine checked out at the commits the page pins (read from reef.js), plus the release checks (versions, policy pins), the
# page itself in headless Chromium with a fake node (test/smoke.mjs), the formatting, and that a code change bumped the version.
# Only a green run on main is deployed to GitHub Pages (the deploy job); after it, the published apps' node pins are compared.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pins
        id: pins
        run: |
          echo "node=$(grep -o 'blaketestnode@[0-9a-f]\{40\}' reef.js | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          echo "lib=$(grep -o 'sidestr/spec@[0-9a-f]\{40\}' reef.js | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          echo "engine=$(grep -o 'schema@[0-9a-f]\{40\}' reef.js | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: bitcoin-blake/blaketestnode, ref: '${{ steps.pins.outputs.node }}', path: deps/blaketestnode, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: sidestr/spec, ref: '${{ steps.pins.outputs.lib }}', path: deps/spec }
      - uses: actions/checkout@v4
        with: { repository: bitcoin-desktop/schema, ref: '${{ steps.pins.outputs.engine }}', path: deps/schema }
      - run: npm test
        env:
          BLAKETESTNODE: ${{ github.workspace }}/deps/blaketestnode
          SIDESTR_LIB: ${{ github.workspace }}/deps/spec/siding/lib
          SCHEMA: ${{ github.workspace }}/deps/schema
      - name: formatting
        run: npx --yes prettier@3.3.3 --check reef.js lib test
      - name: version bumped with the code, and upwards
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD~1 2>/dev/null || true); fi
          [ -z "$base" ] || node tools/version-up.mjs "$base"
      - name: the site to deploy, and every file it refers to is in it
        run: |
          node tools/site.mjs _site
      - uses: actions/upload-artifact@v4
        with: { name: site, path: _site, retention-days: 7 }
      - name: smoke (the page in headless Chromium, fake node)
        run: |
          npm i --no-save playwright-core@1.61.1
          npx playwright-core install --with-deps chromium-headless-shell
          node test/smoke.mjs
        env:
          CI: '1'
          SIDESTR_LIB: ${{ github.workspace }}/deps/spec/siding/lib
          SCHEMA: ${{ github.workspace }}/deps/schema
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: site, path: _site }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
  pins:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the four published apps pin the same node (after this deploy is served)
        run: |
          set -o pipefail
          want=$(node -pe 'require("./version.json").version')
          for i in $(seq 1 30); do
            got=$(curl -fsSL "https://bitcoin-blake.github.io/reef/version.json?nocache=$RANDOM" | node -pe 'JSON.parse(require("fs").readFileSync(0)).version' || true)
            [ "$got" = "$want" ] && break; sleep 10
          done
          if [ "$got" != "$want" ]; then echo "::error::the deployed version.json is $got, not $want, after five minutes"; exit 1; fi
          declare -A pin
          for f in reef/reef.js bight/bight.js winch/winch.js hitch/hitch.js; do
            body=$(curl -fsSL "https://bitcoin-blake.github.io/$f?nocache=$RANDOM") || { echo "::error::could not fetch $f from Pages (the site, not the pins)"; exit 1; }
            p=$(printf '%s' "$body" | grep -o 'blaketestnode@[0-9a-f]\{40\}' | sort -u || true)
            echo "$f: $p"; pin[$f]=$p
            if [ "$(echo "$p" | grep -c .)" != 1 ]; then echo "::error::$f pins more or fewer than one node version"; exit 1; fi
          done
          if [ "$(printf '%s\n' "${pin[@]}" | sort -u | wc -l)" != 1 ]; then echo "::error::the apps pin different node versions"; exit 1; fi

