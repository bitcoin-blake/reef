# Runs the wallet rules and the payment state machine against the real kernel, with the node, the sidestr library and the
# engine checked out at the commits the page pins (read from reef.js), plus the release checks (versions, policy pins), the
# page itself in headless Chromium with a fake node (test/smoke.mjs), the formatting, and that a code change bumped the version.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pins
        id: pins
        run: |
          echo "node=$(grep -o 'blaketestnode@[0-9a-f]\{40\}' reef.js | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          echo "lib=$(grep -o 'sidestr/spec@[0-9a-f]\{40\}' reef.js | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          echo "engine=$(grep -o 'schema@[0-9a-f]\{40\}' reef.js | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: bitcoin-blake/blaketestnode, ref: '${{ steps.pins.outputs.node }}', path: deps/blaketestnode, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: sidestr/spec, ref: '${{ steps.pins.outputs.lib }}', path: deps/spec }
      - uses: actions/checkout@v4
        with: { repository: bitcoin-desktop/schema, ref: '${{ steps.pins.outputs.engine }}', path: deps/schema }
      - run: npm test
        env:
          BLAKETESTNODE: ${{ github.workspace }}/deps/blaketestnode
          SIDESTR_LIB: ${{ github.workspace }}/deps/spec/siding/lib
          SCHEMA: ${{ github.workspace }}/deps/schema
      - name: formatting
        run: npx --yes prettier@3.3.3 --check reef.js lib test
      - name: version bumped with the code
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            changed=$(git diff --name-only HEAD~1 HEAD)
            if echo "$changed" | grep -qE '^(reef\.js|lib/|index\.html)' && ! echo "$changed" | grep -q '^version.json$'; then
              echo "reef.js, lib/ or index.html changed but version.json did not: bump the version (README, Releasing)"; exit 1
            fi
          fi
      - name: smoke (the page in headless Chromium, fake node)
        run: |
          npm i --no-save playwright-core@1.61.1
          npx playwright-core install --with-deps chromium-headless-shell
          node test/smoke.mjs
        env:
          CI: '1'
          SIDESTR_LIB: ${{ github.workspace }}/deps/spec/siding/lib
          SCHEMA: ${{ github.workspace }}/deps/schema
